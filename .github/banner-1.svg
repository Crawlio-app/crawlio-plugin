<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" fill="none">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .titlebar { fill: #161b22; }
      .art {
        fill: #3fb950;
        font-family: 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
        font-size: 14px;
        filter: url(#glow);
      }
      .tagline {
        fill: #8b949e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
      }
      .ver {
        fill: #3fb950;
        font-family: 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="680" height="236" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Terminal background -->
    <rect class="bg" width="680" height="236"/>

    <!-- Title bar -->
    <rect class="titlebar" width="680" height="36"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>

    <!-- ASCII art banner -->
    <text class="art" xml:space="preserve">
      <tspan x="28" y="68"> ██████╗██████╗  █████╗ ██╗    ██╗██╗     ██╗ ██████╗</tspan>
      <tspan x="28" y="86">██╔════╝██╔══██╗██╔══██╗██║    ██║██║     ██║██╔═══██╗</tspan>
      <tspan x="28" y="104">██║     ██████╔╝███████║██║ █╗ ██║██║     ██║██║   ██║</tspan>
      <tspan x="28" y="122">██║     ██╔══██╗██╔══██║██║███╗██║██║     ██║██║   ██║</tspan>
      <tspan x="28" y="140">╚██████╗██║  ██║██║  ██║╚███╔███╔╝███████╗██║╚██████╔╝</tspan>
      <tspan x="28" y="158"> ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚══╝╚══╝ ╚══════╝╚═╝ ╚═════╝</tspan>
    </text>

    <!-- Tagline + version -->
    <text class="tagline" x="28" y="194">Website downloader for macOS</text>
    <text class="ver" x="570" y="194">v1.0.0</text>

    <!-- Subtle bottom border glow -->
    <rect y="232" width="680" height="4" fill="#3fb950" opacity="0.15"/>
  </g>
</svg>
